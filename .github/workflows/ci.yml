name: Django API CI/CD

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches-ignore:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SETTINGS_MODULE: ReadSquare.settings
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      SECRET_KEY: 'test-secret-key-for-ci'
      DEBUG: 'True'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django coverage

      - name: Create test settings
        run: |
          cat > test_settings.py << EOF
          from ReadSquare.settings import *
          
          # Override for testing
          DATABASES = {
              'default': {
                  'ENGINE': 'django.db.backends.postgresql',
                  'NAME': 'test_db',
                  'USER': 'postgres',
                  'PASSWORD': 'postgres',
                  'HOST': 'localhost',
                  'PORT': '5432',
              }
          }
          
          # Disable email during tests
          EMAIL_BACKEND = 'django.core.mail.backends.locmem.EmailBackend'
          
          # Fast password hashing for tests
          PASSWORD_HASHERS = [
              'django.contrib.auth.hashers.MD5PasswordHasher',
          ]
          
          # Disable migrations for faster tests
          class DisableMigrations:
              def __contains__(self, item):
                  return True
              def __getitem__(self, item):
                  return None
          
          MIGRATION_MODULES = DisableMigrations()
          EOF

      - name: Run Django system checks
        run: |
          python manage.py check --settings=test_settings

      - name: Create and run migrations
        run: |
          python manage.py makemigrations --settings=test_settings
          python manage.py migrate --settings=test_settings

      - name: Run Django tests
        run: |
          python manage.py test --settings=test_settings --verbosity=2

      - name: Run API integration tests with coverage
        run: |
          coverage run --source='.' manage.py test --settings=test_settings
          coverage report
          coverage xml

      - name: Create test superuser and test basic API endpoints
        run: |
          python manage.py shell --settings=test_settings << EOF
          from django.contrib.auth import get_user_model
          from django.test import Client
          import json
          
          User = get_user_model()
          
          # Create test user
          user = User.objects.create_user(
              username='testuser',
              email='test@example.com',
              first_name='Test',
              last_name='User',
              password='testpass123'
          )
          
          # Test API endpoints
          client = Client()
          
          # Test user registration
          response = client.post('/api/auth/register/', {
              'username': 'newuser',
              'email': 'newuser@example.com',
              'first_name': 'New',
              'last_name': 'User',
              'password': 'newpass123',
              'confirm_password': 'newpass123'
          }, content_type='application/json')
          
          print(f"Registration test: {response.status_code}")
          
          # Test login
          response = client.post('/api/auth/login/', {
              'email': 'test@example.com',
              'password': 'testpass123'
          }, content_type='application/json')
          
          print(f"Login test: {response.status_code}")
          
          if response.status_code == 200:
              data = json.loads(response.content)
              if 'tokens' in data:
                  print("JWT tokens generated successfully")
              else:
                  print("Warning: No JWT tokens in response")
          
          print("Basic API tests completed")
          EOF

      - name: Test API documentation endpoints
        run: |
          python manage.py shell --settings=test_settings << EOF
          from django.test import Client
          from django.urls import reverse
          
          client = Client()
          
          # Test if all URL patterns are working
          test_urls = [
              '/api/auth/register/',
              '/api/auth/login/',
              '/admin/',
          ]
          
          for url in test_urls:
              try:
                  response = client.post(url) if 'auth' in url else client.get(url)
                  print(f"URL {url}: Status {response.status_code}")
              except Exception as e:
                  print(f"URL {url}: Error - {e}")
          
          print("URL pattern tests completed")
          EOF

      - name: Security and code quality checks
        run: |
          # Check for potential security issues
          python manage.py check --deploy --settings=test_settings || true
          
          # Check for missing migrations
          python manage.py makemigrations --check --dry-run --settings=test_settings

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run Black code formatter check
        run: |
          black --check --diff .

      - name: Run isort import sorting check
        run: |
          isort --check-only --diff .

      - name: Run flake8 linting
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
            