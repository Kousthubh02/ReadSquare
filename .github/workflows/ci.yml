name: Django API CI/CD

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches-ignore:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SETTINGS_MODULE: ReadSquare.settings
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      SECRET_KEY: 'test-secret-key-for-ci'
      DEBUG: 'True'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django coverage
          
      - name: Create required directories
        run: |
          mkdir -p static
          mkdir -p media

      - name: Create test settings
        run: |
          cat > test_settings.py << EOF
          import os
          from ReadSquare.settings import *
          
          # Override for testing
          DATABASES = {
              'default': {
                  'ENGINE': 'django.db.backends.postgresql',
                  'NAME': 'test_db',
                  'USER': 'postgres',
                  'PASSWORD': 'postgres',
                  'HOST': 'localhost',
                  'PORT': '5432',
              }
          }
          
          # Disable email during tests
          EMAIL_BACKEND = 'django.core.mail.backends.locmem.EmailBackend'
          
          # Fast password hashing for tests
          PASSWORD_HASHERS = [
              'django.contrib.auth.hashers.MD5PasswordHasher',
          ]
          
          # Fix static files path for CI
          STATICFILES_DIRS = []
          STATIC_ROOT = '/tmp/static/'
          
          # Debug settings for development CI
          DEBUG = True
          ALLOWED_HOSTS = ['*']
          
          # Suppress security warnings for development CI (only the ones we can't fix in dev)
          SILENCED_SYSTEM_CHECKS = [
              'security.W004',  # SECURE_HSTS_SECONDS (HTTPS only)
              'security.W008',  # SECURE_SSL_REDIRECT (HTTPS only)
              'security.W009',  # SECRET_KEY (development key)
              'security.W018',  # DEBUG=True (development mode)
          ]
          
          # Suppress warnings for CI
          import warnings
          warnings.filterwarnings('ignore', category=Warning)
          EOF

      - name: Run Django system checks
        run: |
          python manage.py check --settings=test_settings

      - name: Run CI setup validation
        run: |
          DJANGO_SETTINGS_MODULE=test_settings python test_ci_setup.py

      - name: Create and run migrations
        run: |
          python manage.py makemigrations --settings=test_settings
          python manage.py migrate --settings=test_settings

      - name: Collect static files
        run: |
          python manage.py collectstatic --noinput --settings=test_settings

      - name: Run Django tests
        run: |
          python manage.py test --settings=test_settings --verbosity=2 --debug-mode

      - name: Debug failing login test
        run: |
          python manage.py shell --settings=test_settings -c "
          from django.contrib.auth import get_user_model, authenticate
          from django.test import Client
          import json
          
          User = get_user_model()
          print('=== Login Debug Test ===')
          
          # Create test user
          user = User.objects.create_user(
              username='testuser',
              email='test@example.com', 
              password='testpass123',
              is_verified=True
          )
          print(f'User created: {user.username}, email: {user.email}')
          
          # Test authenticate methods
          auth_user = authenticate(username='testuser', password='testpass123')
          print(f'Authenticate with username: {auth_user}')
          
          auth_user_email = authenticate(username='test@example.com', password='testpass123')
          print(f'Authenticate with email: {auth_user_email}')
          
          # Test API endpoint
          client = Client()
          response = client.post('/api/auth/login/', {
              'email': 'test@example.com',
              'password': 'testpass123'
          }, content_type='application/json')
          
          print(f'API response status: {response.status_code}')
          if response.status_code != 200:
              print(f'Error response: {response.content.decode()}')
          
          user.delete()
          print('Debug test completed')
          "

      - name: Run specific API tests with coverage
        run: |
          coverage run --source='.' manage.py test api.test_api --settings=test_settings --verbosity=2
          coverage report
          coverage xml

      - name: Test basic API functionality
        run: |
          python manage.py shell --settings=test_settings -c "
          from django.contrib.auth import get_user_model
          from django.test import Client
          import json
          
          User = get_user_model()
          print('Testing basic user creation...')
          user = User.objects.create_user(username='testuser', email='test@example.com', password='testpass123')
          print(f'User created: {user.username}')
          
          client = Client()
          print('Testing registration endpoint...')
          response = client.post('/api/auth/register/', {
              'username': 'newuser',
              'email': 'newuser@example.com', 
              'first_name': 'New',
              'last_name': 'User',
              'password': 'newpass123',
              'confirm_password': 'newpass123'
          }, content_type='application/json')
          print(f'Registration response: {response.status_code}')
          
          print('Basic API tests completed successfully')
          "

      - name: Security and code quality checks
        run: |
          # Check for potential security issues (excluding deployment checks for development)
          python manage.py check --settings=test_settings || true
          
          # Check for missing migrations
          python manage.py makemigrations --check --dry-run --settings=test_settings

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run Black code formatter check
        run: |
          black --check --diff .

      - name: Run isort import sorting check
        run: |
          isort --check-only --diff .

      - name: Run flake8 linting
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
            